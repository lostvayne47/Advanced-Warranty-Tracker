spring.application.name=warranty-tracker
server.port=${PORT:5000}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=warranty-tracker
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}
server.error.include-message=never
spring.flyway.enabled=true
spring.flyway.default-schema=warranty_migrations
spring.flyway.schemas=warranty_migrations
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.data-source-properties.socketTimeout=120
app.storage.enabled=${SUPABASE_STORAGE_ENABLED:false}
app.storage.url=${SUPABASE_URL:}
app.storage.service-key=${SUPABASE_SERVICE_ROLE_KEY:}
app.storage.signed-url-seconds=300
app.storage.cleanup-enabled=true
app.storage.cleanup-delay-ms=60000
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
